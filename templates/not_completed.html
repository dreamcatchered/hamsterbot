<!DOCTYPE html>
<html lang="ru">

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;

        h1 {
            font-size: 2em;

        }

            color: #666;
            line-height: 1.6;

</head>
<body>
    <div class="container">
        <div class="emoji">⏸️</div>
        <h1>сессия не завершена</h1>
